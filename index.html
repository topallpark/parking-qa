<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全之駐停車場-客服應對SOP</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231A56DB%22/><text y=%22.75em%22 x=%2250%22 font-family=%22Arial%22 font-weight=%22bold%22 font-size=%2270%22 text-anchor=%22middle%22 fill=%22white%22>P</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 基礎樣式與變數 */
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{ --bg:#F8F9FA; --surface:#FFF; --accent:#1A56DB; --text:#1F2937; --border:#E5E7EB; --r:12px; }
        body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);padding-bottom:60px;min-height:100vh}
        
        /* 導航欄 */
        header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
        .logo{display:flex;align-items:center;gap:12px;cursor:pointer}
        .logo-box{background:var(--accent);color:white;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:bold;font-size:18px}
        
        /* 主要容器 */
        main{max-width:850px;margin:24px auto;padding:0 20px}
        .search-container{background:white;border:2px solid var(--border);border-radius:var(--r);padding:4px 18px;margin-bottom:20px;display:flex;align-items:center;transition:0.2s}
        .search-container:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(26,86,219,0.1)}
        .search-container input{border:none;outline:none;width:100%;height:52px;font-size:16px}
        
        /* 分類標籤 */
        .tag-row{margin-bottom:24px;display:flex;gap:10px;flex-wrap:wrap}
        .tag{padding:8px 20px;background:white;border:1px solid var(--border);border-radius:50px;font-size:14px;cursor:pointer;transition:0.2s;font-weight:500}
        .tag.active{background:var(--accent);color:white;border-color:var(--accent);box-shadow:0 4px 12px rgba(26,86,219,0.2)}
        
        /* QA 卡片 */
        .qa-card{background:white;border:1px solid var(--border);border-radius:var(--r);margin-bottom:15px;overflow:hidden;transition:0.2s;cursor:pointer}
        .qa-card:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(0,0,0,0.05)}
        .qa-header{padding:18px 24px;display:flex;align-items:center;gap:15px}
        .q-badge{font-size:11px;background:#EEF2FF;color:var(--accent);padding:4px 12px;border-radius:6px;font-weight:700}
        .q-text{flex:1;font-weight:700;font-size:17px}
        .qa-body{padding:0 24px 24px;display:none;background:#FAFBFF;border-top:1px solid var(--border);animation:fadeIn 0.3s}
        .qa-card.open .qa-body{display:block}
        
        /* 對話展示樣式 */
        .conv-group{background:white;border:1px solid var(--border);padding:15px;border-radius:8px;margin-top:15px}
        .conv-label{font-size:12px;font-weight:bold;color:var(--accent);margin-bottom:8px;display:block}
        .conv-intro{background:#F3F4F6;padding:10px;border-radius:6px;margin-bottom:10px;font-size:15px;border-left:4px solid var(--accent)}
        .conv-step{display:flex;gap:10px;font-size:14.5px;margin-bottom:5px}
        .step-n{width:20px;height:20px;background:var(--accent);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}

        /* 彈窗樣式 */
        .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);align-items:center;justify-content:center;z-index:200}
        .modal-bg.open{display:flex}
        .modal{background:white;padding:30px;border-radius:20px;width:95%;max-width:650px;max-height:85vh;overflow-y:auto}
        .field{margin-bottom:20px}
        .field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
        .field input, .field select, .field textarea{width:100%;padding:12px;border:1px solid #D1D5DB;border-radius:10px;font-size:15px;font-family:inherit}
        
        /* 編輯區域對話組樣式 */
        .edit-conv-item{border:2px solid #E5E7EB;padding:20px;border-radius:15px;margin-bottom:20px;position:relative;background:#FFF}
        .step-input-group{display:flex;gap:8px;margin-bottom:8px;align-items:center}
        .step-number-label{width:24px;font-weight:bold;color:var(--accent);font-size:14px}
        .btn-add-step{background:#EEF2FF;color:var(--accent);width:100%;padding:8px;margin-top:10px;font-size:13px;border-radius:8px;border:1px dashed var(--accent);cursor:pointer;font-weight:bold}
        .btn-add-step:hover{background:var(--accent);color:white}

        /* 按鈕樣式 */
        .btn{padding:10px 20px;border-radius:10px;cursor:pointer;font-weight:600;border:none;transition:0.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
        .btn-primary{background:var(--accent);color:white}
        .btn-ghost{background:#F3F4F6;color:#4B5563}
        .btn-danger-small{background:none;color:#999;border:none;cursor:pointer;padding:4px}
        .btn-danger-small:hover{color:red}
        
        @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="location.reload()">
        <div class="logo-box">P</div>
        <strong style="font-size:18px; letter-spacing:1px">全之駐停車場</strong>
    </div>
    <div>
        <button class="btn btn-ghost" style="font-size:14px" onclick="openAdmin()">管理後台</button>
    </div>
</header>

<main>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="搜尋問題、話術關鍵字..." oninput="render()">
    </div>
    <div class="tag-row" id="tagRow"></div>
    <div id="qaList"></div>
</main>

<div class="modal-bg" id="adminModal">
    <div class="modal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px">
            <h2 style="font-size:22px">系統管理</h2>
            <button class="btn btn-primary" onclick="openQA()">＋ 新增 SOP 問題</button>
        </div>
        <div class="field">
            <label>類別與排序管理</label>
            <div id="categoryManagerList" style="background:#F9FAFB; padding:15px; border-radius:10px; border:1px solid #EEE"></div>
            <button class="btn btn-ghost" style="width:100%; margin-top:10px; font-size:12px" onclick="addNewCategory()">+ 新增類別</button>
        </div>
        <div class="field">
            <label>GitHub 通行證 (Token)</label>
            <input type="password" id="ghToken" placeholder="請填寫以啟用雲端發布...">
        </div>
        <div style="display:flex; gap:10px; margin-top:30px">
            <button class="btn btn-ghost" style="flex:1" onclick="closeAdmin()">關閉</button>
            <button class="btn btn-primary" style="flex:1" onclick="saveAdminSettings()">儲存變更</button>
        </div>
    </div>
</div>

<div class="modal-bg" id="qaModal">
    <div class="modal">
        <h2 id="mTitle" style="margin-bottom:20px">編輯 SOP 內容</h2>
        <div class="field"><label>所屬類別</label><select id="fTag"></select></div>
        <div class="field"><label>問題標題</label><input type="text" id="fQ"></div>
        
        <div id="conversationsContainer"></div>
        
        <button class="btn btn-ghost" style="width:100%; margin:10px 0 20px; border:1px dashed #DDD" onclick="addConvField()">＋ 新增一組情境對應</button>
        
        <div style="display:flex; gap:10px">
            <button class="btn btn-ghost" style="flex:1" onclick="closeQA()">取消</button>
            <button class="btn btn-primary" style="flex:1" id="saveBtn" onclick="submitToCloud()">更新至雲端倉庫</button>
        </div>
    </div>
</div>

<script>
// --- 資料儲存區 (自動更新) ---
let categories = [{id:"gate",name:"柵門問題",order:1},{id:"fee",name:"繳費問題",order:2},{id:"ticket",name:"發票載具",order:3}];
let qaData = [];

// --- 邏輯處理 ---
let editingId = null;
let currentFilter = 'all';

function openAdmin() {
    document.getElementById('adminModal').classList.add('open');
    document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
    renderCatManager();
}
function closeAdmin() { document.getElementById('adminModal').classList.remove('open'); }

function renderCatManager() {
    const container = document.getElementById('categoryManagerList');
    container.innerHTML = categories.sort((a,b)=>a.order-b.order).map((c, i) => `
        <div style="display:flex; gap:8px; margin-bottom:8px">
            <input type="text" value="${c.name}" onchange="categories[${i}].name=this.value" style="flex:3; padding:6px 10px; border-radius:6px; border:1px solid #DDD">
            <input type="number" value="${c.order}" onchange="categories[${i}].order=parseInt(this.value)" style="flex:1; padding:6px; border-radius:6px; border:1px solid #DDD; text-align:center">
            <button class="btn-danger-small" onclick="if(confirm('確定刪除類別？')){categories.splice(${i},1);renderCatManager()}">✕</button>
        </div>
    `).join('');
}
function addNewCategory() { categories.push({id:"cat_"+Date.now(), name:"新類別", order:categories.length+1}); renderCatManager(); }

function saveAdminSettings() {
    localStorage.setItem('gh_token', document.getElementById('ghToken').value);
    submitToCloud(true);
}

function render() {
    const row = document.getElementById('tagRow');
    const sortedCats = [...categories].sort((a,b)=>a.order-b.order);
    row.innerHTML = `<span class="tag ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">全部</span>` +
        sortedCats.map(c => `<span class="tag ${currentFilter===c.id?'active':''}" onclick="setFilter('${c.id}')">${c.name}</span>`).join('');

    const kw = document.getElementById('searchInput').value.toLowerCase();
    const list = document.getElementById('qaList');
    const filtered = qaData.filter(d => (currentFilter==='all' || d.tag===currentFilter) && (d.q.toLowerCase().includes(kw) || JSON.stringify(d.convs).toLowerCase().includes(kw)));

    list.innerHTML = filtered.map(item => `
        <div class="qa-card" onclick="this.classList.toggle('open')">
            <div class="qa-header">
                <span class="q-badge">${categories.find(c=>c.id===item.tag)?.name || '未分類'}</span>
                <span class="q-text">${item.q}</span>
                ${localStorage.getItem('gh_token') ? `<button class="btn btn-ghost" style="font-size:11px; padding:4px 8px" onclick="event.stopPropagation();editSOP(${item.id})">編輯</button>` : ''}
            </div>
            <div class="qa-body">
                ${item.convs.map((c, i) => `
                    <div class="conv-group">
                        <span class="conv-label">情境對應 ${i+1}</span>
                        <div class="conv-intro">${c.intro}</div>
                        ${c.steps.split('\n').filter(s=>s.trim()).map((s, si) => `
                            <div class="conv-step"><div class="step-n">${si+1}</div>${s}</div>
                        `).join('')}
                    </div>
                `).join('')}
            </div>
        </div>
    `).join('');
}
function setFilter(t) { currentFilter = t; render(); }

// --- 編輯功能專用 ---

// 產生一個單獨的步驟輸入框
function createStepInput(val = '') {
    const div = document.createElement('div');
    div.className = 'step-input-group';
    div.innerHTML = `
        <span class="step-number-label"></span>
        <input type="text" class="step-input" value="${val}" placeholder="輸入步驟內容...">
        <button class="btn-danger-small" onclick="const p=this.parentElement.parentElement; this.parentElement.remove(); renumberSteps(p)">✕</button>
    `;
    return div;
}

// 重新編號
function renumberSteps(container) {
    container.querySelectorAll('.step-number-label').forEach((label, i) => {
        label.textContent = (i + 1) + '.';
    });
}

// 新增一個情境大區塊
function addConvField(intro = '', stepsStr = '') {
    const container = document.getElementById('conversationsContainer');
    const div = document.createElement('div');
    div.className = 'edit-conv-item';
    
    // 話術標題區
    div.innerHTML = `
        <button onclick="this.parentElement.remove()" style="position:absolute; right:10px; top:10px; border:none; background:none; cursor:pointer; color:#AAA">✕ 刪除整組</button>
        <div class="field" style="margin-bottom:15px">
            <label style="color:var(--accent)">💬 對話話術</label>
            <input type="text" class="edit-intro" value="${intro}" placeholder="例如：您好，請問您的車牌是...">
        </div>
        <label style="font-size:14px; font-weight:700; margin-bottom:8px; display:block">🛠️ 處理步驟</label>
        <div class="steps-list-container"></div>
        <button class="btn-add-step" onclick="this.previousElementSibling.appendChild(createStepInput()); renumberSteps(this.previousElementSibling)">＋ 新增步驟</button>
    `;
    
    container.appendChild(div);
    
    // 填充既有的步驟
    const stepsList = div.querySelector('.steps-list-container');
    if (stepsStr) {
        stepsStr.split('\n').filter(s => s.trim()).forEach(s => {
            stepsList.appendChild(createStepInput(s));
        });
    } else {
        stepsList.appendChild(createStepInput()); // 預設給一個空步驟
    }
    renumberSteps(stepsList);
}

function editSOP(id) {
    editingId = id;
    const item = qaData.find(d => d.id === id);
    document.getElementById('fTag').innerHTML = categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
    document.getElementById('fTag').value = item.tag;
    document.getElementById('fQ').value = item.q;
    document.getElementById('conversationsContainer').innerHTML = '';
    item.convs.forEach(c => addConvField(c.intro, c.steps));
    document.getElementById('qaModal').classList.add('open');
    closeAdmin();
}

function openQA() {
    editingId = null;
    document.getElementById('fQ').value = '';
    document.getElementById('fTag').innerHTML = categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
    document.getElementById('conversationsContainer').innerHTML = '';
    addConvField();
    document.getElementById('qaModal').classList.add('open');
    closeAdmin();
}
function closeQA() { document.getElementById('qaModal').classList.remove('open'); openAdmin(); }

async function submitToCloud(isAdminSave = false) {
    const token = localStorage.getItem('gh_token');
    if(!token) return alert("請先在開發者設置中填寫 GitHub 通行證");

    if(!isAdminSave) {
        // 抓取所有編輯中的情境
        const convs = Array.from(document.querySelectorAll('.edit-conv-item')).map(item => {
            // 抓取該組內所有的步驟輸入框並用換行合併
            const stepInputs = Array.from(item.querySelectorAll('.step-input')).map(i => i.value.trim()).filter(v => v);
            return {
                intro: item.querySelector('.edit-intro').value,
                steps: stepInputs.join('\n')
            };
        });
        
        const newItem = { id: editingId || Date.now(), tag: document.getElementById('fTag').value, q: document.getElementById('fQ').value, convs };
        if(editingId) qaData[qaData.findIndex(d=>d.id===editingId)] = newItem;
        else qaData.push(newItem);
    }

    const btn = document.getElementById('saveBtn');
    if(btn) { btn.disabled = true; btn.textContent = "發布中..."; }

    try {
        const url = `https://api.github.com/repos/topallpark/parking-qa/contents/index.html`;
        const res = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
        const fileData = await res.json();
        const oldContent = decodeURIComponent(escape(atob(fileData.content)));
        
        const dataMarker = "// --- 資料儲存區";
        const endMarker = "// --- 邏輯處理";
        const newDataCode = `// --- 資料儲存區 (自動更新) ---\nlet categories = ${JSON.stringify(categories)};\nlet qaData = ${JSON.stringify(qaData)};\n\n`;
        const newFull = oldContent.substring(0, oldContent.indexOf(dataMarker)) + newDataCode + oldContent.substring(oldContent.indexOf(endMarker));

        await fetch(url, {
            method: 'PUT',
            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: 'Update SOP Steps UI', content: btoa(unescape(encodeURIComponent(newFull))), sha: fileData.sha })
        });
        alert("✅ 同步發布成功！網頁即將更新。");
        document.querySelectorAll('.modal-bg').forEach(m => m.classList.remove('open'));
        render();
    } catch (e) { alert("同步失敗，請檢查網路或 Token。"); }
    finally { if(btn) { btn.disabled = false; btn.textContent = "更新至雲端倉庫"; } }
}

render();
</script>
</body>
</html>
