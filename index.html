<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>停車場客服 SOP 雲端管理版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 繼承您原始的所有 CSS 並微調 */
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --bg:#F5F4F0;--surface:#FFF;--border:rgba(0,0,0,0.1);--border-h:rgba(0,0,0,0.2);
            --text:#1A1A1A;--muted:#6B6B6B;--hint:#ABABAB;
            --accent:#1A56DB;--accent-l:#EEF3FF;--accent-d:#1440A8;
            --danger:#DC2626;--danger-l:#FEF2F2;
            --success:#16A34A;--success-l:#F0FDF4;
            --r:10px;
        }
        body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.6}
        header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:54px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200}
        .h-icon{width:30px;height:30px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center}
        .h-icon svg{width:15px;height:15px;fill:white}
        header h1{font-size:15px;font-weight:700}
        .h-actions{margin-left:auto;display:flex;gap:8px}
        .btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:6px 13px;border-radius:7px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:500;transition:0.15s}
        .btn-primary{background:var(--accent);color:white;border-color:var(--accent)}
        main{max-width:820px;margin:0 auto;padding:24px 16px 80px}
        .search-box{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);display:flex;align-items:center;gap:10px;padding:0 14px;margin-bottom:12px}
        .search-box input{border:none;outline:none;width:100%;height:44px;font-family:inherit}
        .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
        .tag{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer}
        .tag.active{background:var(--accent);color:white}
        .qa-list{display:flex;flex-direction:column;gap:8px}
        .qa-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
        .qa-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
        .q-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--accent-l);color:var(--accent)}
        .q-text{font-size:14px;font-weight:500;flex:1}
        .qa-body{border-top:1px solid var(--border);padding:16px;display:none;background:#FAFAFA}
        .qa-card.open .qa-body{display:block}
        .step{display:flex;gap:10px;margin-bottom:8px;background:white;padding:10px;border-radius:8px;border:1px solid var(--border)}
        .step-num{width:20px;height:20px;border-radius:50%;background:var(--accent-l);color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
        
        /* 彈窗樣式 */
        .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center;padding:20px}
        .modal-bg.open{display:flex}
        .modal{background:var(--surface);border-radius:14px;width:100%;max-width:500px;padding:20px}
        .field{margin-bottom:12px}
        .field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
        .field input, .field select, .field textarea{width:100%;padding:8px;border:1px solid var(--border);border-radius:6px}
        
        /* 管理功能區 */
        .admin-controls{background:#fff;border:1px dashed var(--accent);padding:15px;border-radius:10px;margin-bottom:20px}
        .cat-manager{margin-top:15px;padding-top:15px;border-top:1px solid var(--border)}
        .cat-item{display:inline-flex;align-items:center;background:#eee;padding:2px 8px;border-radius:4px;margin:2px;font-size:12px}
        .cat-del{margin-left:5px;cursor:pointer;color:red;font-weight:bold}
    </style>
</head>
<body>

<header>
    <div class="h-icon"><svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v14l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg></div>
    <h1>停車場客服 SOP 系統</h1>
    <div class="h-actions">
        <button class="btn" onclick="toggleAdmin()" id="adminToggle">後台管理</button>
    </div>
</header>

<main>
    <!-- 後台管理面板 -->
    <div id="adminPanel" class="admin-controls" style="display:none">
        <div style="display:flex; justify-content:space-between; align-items:center">
            <strong>🔧 後台控制台 (資料已自動儲存至瀏覽器)</strong>
            <button class="btn btn-primary" onclick="openQA()">新增 SOP 問題</button>
        </div>
        
        <div class="cat-manager">
            <p style="font-size:12px; font-weight:bold">類別管理：</p>
            <div id="catListDisplay" style="margin:8px 0"></div>
            <div style="display:flex; gap:5px">
                <input type="text" id="newCatInput" placeholder="新類別名稱" style="padding:5px; border-radius:4px; border:1px solid #ccc; flex:1">
                <button class="btn" onclick="addCategory()">新增類別</button>
            </div>
        </div>
        <p style="font-size:11px; color:orange; margin-top:10px">※ 提示：本機儲存僅限此瀏覽器。若需同步至 GitHub 永久保存，仍建議定期點擊「匯出備份」。</p>
        <button class="btn" style="margin-top:5px; font-size:11px" onclick="exportSite()">匯出備份 index.html</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜尋關鍵字..." oninput="renderList()">
    </div>
    <div class="tag-row" id="tagRow"></div>
    <div class="qa-list" id="qaList"></div>
</main>

<!-- SOP 編輯彈窗 -->
<div class="modal-bg" id="qaModal">
    <div class="modal">
        <h2 id="qaModalTitle">編輯 SOP</h2>
        <div class="field">
            <label>分類</label>
            <select id="fTag"></select>
        </div>
        <div class="field">
            <label>問題 (Q)</label>
            <input type="text" id="fQ">
        </div>
        <div class="field">
            <label>開頭回覆</label>
            <textarea id="fIntro"></textarea>
        </div>
        <div class="field">
            <label>處理步驟 (每行一步驟)</label>
            <textarea id="fSteps" style="min-height:100px" placeholder="第一步&#10;第二步"></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px">
            <button class="btn" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveQA()">儲存變更</button>
        </div>
    </div>
</div>

<script>
// --- 資料初始化 ---
let categories = JSON.parse(localStorage.getItem('parking_cats')) || {
    gate: '柵門問題',
    fee: '繳費問題',
    ticket: '發票/載具',
    other: '其他'
};

let qaData = JSON.parse(localStorage.getItem('parking_qa')) || [
    {id:1,tag:'gate',q:'柵門打不開',intro:'你好，請問有繳費了嗎？',steps:['尚未繳費：告知前往繳費','已繳費：手動開門']}
];

let activeTag = 'all';
let adminMode = false;
let editingId = null;

// --- 核心儲存功能 ---
function saveData() {
    localStorage.setItem('parking_cats', JSON.stringify(categories));
    localStorage.setItem('parking_qa', JSON.stringify(qaData));
    renderTags();
    renderList();
}

// --- 類別管理 ---
function renderTags() {
    const tagRow = document.getElementById('tagRow');
    const fTag = document.getElementById('fTag');
    const catDisplay = document.getElementById('catListDisplay');
    
    let tagsHtml = `<span class="tag ${activeTag==='all'?'active':''}" onclick="setTag('all')">全部</span>`;
    let selectHtml = '';
    let adminCatHtml = '';

    for (let key in categories) {
        tagsHtml += `<span class="tag ${activeTag===key?'active':''}" onclick="setTag('${key}')">${categories[key]}</span>`;
        selectHtml += `<option value="${key}">${categories[key]}</option>`;
        adminCatHtml += `<span class="cat-item">${categories[key]} <span class="cat-del" onclick="deleteCategory('${key}')">×</span></span>`;
    }

    tagRow.innerHTML = tagsHtml;
    fTag.innerHTML = selectHtml;
    catDisplay.innerHTML = adminCatHtml;
}

function addCategory() {
    const input = document.getElementById('newCatInput');
    const name = input.value.trim();
    if (!name) return;
    const key = 'cat_' + Date.now();
    categories[key] = name;
    input.value = '';
    saveData();
}

function deleteCategory(key) {
    if (confirm(`確定刪除「${categories[key]}」類別？該類別下的問題將變成「其他」。`)) {
        qaData.forEach(item => { if(item.tag === key) item.tag = 'other'; });
        delete categories[key];
        saveData();
    }
}

// --- SOP 管理 ---
function toggleAdmin() {
    adminMode = !adminMode;
    document.getElementById('adminPanel').style.display = adminMode ? 'block' : 'none';
    document.getElementById('adminToggle').textContent = adminMode ? '關閉後台' : '後台管理';
    renderList();
}

function setTag(k) { activeTag = k; renderTags(); renderList(); }

function openQA(id = null) {
    editingId = id;
    if (id) {
        const item = qaData.find(d => d.id === id);
        document.getElementById('fTag').value = item.tag;
        document.getElementById('fQ').value = item.q;
        document.getElementById('fIntro').value = item.intro;
        document.getElementById('fSteps').value = item.steps.join('\n');
        document.getElementById('qaModalTitle').textContent = '編輯 SOP';
    } else {
        document.getElementById('fQ').value = '';
        document.getElementById('fIntro').value = '';
        document.getElementById('fSteps').value = '';
        document.getElementById('qaModalTitle').textContent = '新增 SOP';
    }
    document.getElementById('qaModal').classList.add('open');
}

function saveQA() {
    const newItem = {
        id: editingId || Date.now(),
        tag: document.getElementById('fTag').value,
        q: document.getElementById('fQ').value,
        intro: document.getElementById('fIntro').value,
        steps: document.getElementById('fSteps').value.split('\n').filter(s => s.trim())
    };

    if (editingId) {
        const idx = qaData.findIndex(d => d.id === editingId);
        qaData[idx] = newItem;
    } else {
        qaData.push(newItem);
    }
    closeModal();
    saveData();
}

function deleteQA(id) {
    if (confirm('確定刪除此 SOP？')) {
        qaData = qaData.filter(d => d.id !== id);
        saveData();
    }
}

function closeModal() { document.getElementById('qaModal').classList.remove('open'); }

// --- 列表渲染 ---
function renderList() {
    const kw = document.getElementById('searchInput').value.toLowerCase();
    const filtered = qaData.filter(d => {
        const matchTag = activeTag === 'all' || d.tag === activeTag;
        const matchSearch = d.q.toLowerCase().includes(kw) || d.intro.toLowerCase().includes(kw);
        return matchTag && matchSearch;
    });

    document.getElementById('qaList').innerHTML = filtered.map(item => `
        <div class="qa-card" id="card-${item.id}">
            <div class="qa-header" onclick="this.parentElement.classList.toggle('open')">
                <span class="q-badge">${categories[item.tag] || '其他'}</span>
                <span class="q-text">${item.q}</span>
                ${adminMode ? `
                    <button class="btn" onclick="event.stopPropagation();openQA(${item.id})">改</button>
                    <button class="btn" style="color:red" onclick="event.stopPropagation();deleteQA(${item.id})">刪</button>
                ` : ''}
            </div>
            <div class="qa-body">
                <div style="background:#fff; padding:10px; border-left:3px solid var(--accent); margin-bottom:10px">${item.intro}</div>
                ${item.steps.map((s, i) => `<div class="step"><div class="step-num">${i+1}</div><div>${s}</div></div>`).join('')}
                <button class="btn" onclick="copyText('${item.intro}\\n${item.steps.join('\\n')}')">複製話術</button>
            </div>
        </div>
    `).join('');
}

function copyText(txt) {
    navigator.clipboard.writeText(txt.replace(/\\n/g, '\n'));
    alert('已複製到剪貼簿');
}

// --- 匯出功能 (用於同步回 GitHub) ---
function exportSite() {
    const html = document.documentElement.outerHTML;
    // 更新 HTML 內的初始變數，讓下載的檔案包含最新資料
    const updatedHtml = html
        .replace(/let categories = JSON.parse\(localStorage.getItem\('parking_cats'\)\) \|\| \{[\s\S]*?\};/, `let categories = ${JSON.stringify(categories)};`)
        .replace(/let qaData = JSON.parse\(localStorage.getItem\('parking_qa'\)\) \|\| \[[\s\S]*?\];/, `let qaData = ${JSON.stringify(qaData)};`);
    
    const blob = new Blob([updatedHtml], {type: 'text/html'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'index.html';
    a.click();
}

// 啟動
renderTags();
renderList();
</script>

</body>
</html>
