<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>停車場客服 SOP 系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{ --bg:#F8F9FA; --surface:#FFF; --accent:#1A56DB; --text:#1F2937; --border:#E5E7EB; --r:12px; }
        body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:60px}
        header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;position:sticky;top:0;z-index:100;justify-content:space-between}
        .logo-area{display:flex;align-items:center;gap:10px;cursor:pointer}
        .logo-icon{background:var(--accent);color:white;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:bold}
        main{max-width:800px;margin:24px auto;padding:0 20px}
        .search-container{background:white;border:2px solid var(--border);border-radius:var(--r);padding:4px 18px;margin-bottom:20px;display:flex;align-items:center}
        .search-container input{border:none;outline:none;width:100%;height:48px;font-size:16px}
        .tag-row{margin-bottom:24px;display:flex;gap:10px;flex-wrap:wrap}
        .tag{padding:8px 18px;background:white;border:1px solid var(--border);border-radius:50px;font-size:14px;cursor:pointer;transition:0.2s}
        .tag.active{background:var(--accent);color:white;border-color:var(--accent)}
        .qa-card{background:white;border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;cursor:pointer}
        .qa-header{padding:16px 20px;display:flex;align-items:center;gap:12px}
        .q-badge{font-size:11px;background:#EFF6FF;color:var(--accent);padding:4px 10px;border-radius:6px;font-weight:700}
        .q-text{flex:1;font-weight:700;font-size:16px}
        .qa-body{padding:20px;display:none;background:#F9FAFB;border-top:1px solid var(--border)}
        .qa-card.open .qa-body{display:block}
        .a-intro{background:white;padding:14px;border-left:4px solid var(--accent);margin-bottom:16px;font-size:15px;border-radius:6px}
        .step{display:flex;gap:12px;margin-bottom:10px}
        .step-num{width:24px;height:24px;background:#DBEAFE;color:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;flex-shrink:0}
        .btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:14px;font-weight:500}
        .btn-primary{background:var(--accent);color:white;border:none}
        .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);align-items:center;justify-content:center;z-index:200}
        .modal-bg.open{display:flex}
        .modal{background:white;padding:28px;border-radius:16px;width:90%;max-width:500px;max-height:90vh;overflow-y:auto}
        .field{margin-bottom:18px}
        .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
        .field input, .field select, .field textarea{width:100%;padding:10px;border:1px solid #D1D5DB;border-radius:8px;font-size:15px}
    </style>
</head>
<body>

<header>
    <div class="logo-area" onclick="countLogoClick()">
        <div class="logo-icon">P</div>
        <strong style="font-size:18px">停車場 SOP 系統</strong>
    </div>
    <div id="adminBtnContainer" style="display:none">
        <button class="btn btn-primary" onclick="toggleAdmin()" id="adminBtn">進入後台</button>
    </div>
</header>

<main>
    <div class="search-container"><input type="text" id="searchInput" placeholder="搜尋關鍵字..." oninput="render()"></div>
    <div class="tag-row" id="tagRow"></div>
    <div id="qaList"></div>
</main>

<div class="modal-bg" id="configModal">
    <div class="modal">
        <h3>⚙️ 管理員設定</h3>
        <div class="field"><label>GitHub Token</label><input type="password" id="ghToken"></div>
        <div class="field"><label>倉庫 (帳號/倉庫名)</label><input type="text" id="ghRepo"></div>
        <hr style="margin:15px 0">
        <h4>類別順序管理</h4>
        <div id="catManager"></div>
        <div style="display:flex; gap:10px; margin-top:20px">
            <button class="btn" style="flex:1" onclick="closeConfig()">關閉</button>
            <button class="btn btn-primary" style="flex:1" onclick="saveConfigAndSync()">儲存並更新雲端</button>
        </div>
    </div>
</div>

<div class="modal-bg" id="qaModal">
    <div class="modal">
        <h3 id="mTitle">編輯 SOP</h3>
        <div class="field"><label>類別</label><select id="fTag"></select></div>
        <div class="field"><label>問題</label><input type="text" id="fQ"></div>
        <div class="field"><label>話術</label><input type="text" id="fIntro"></div>
        <div class="field"><label>步驟</label><textarea id="fSteps" style="height:100px"></textarea></div>
        <div style="display:flex; gap:10px">
            <button class="btn" style="flex:1" onclick="closeQA()">取消</button>
            <button class="btn btn-primary" style="flex:1" id="saveBtn" onclick="submitToCloud()">更新雲端</button>
        </div>
    </div>
</div>

<script>
// --- 資料區 (手動更新一次，之後自動儲存) ---
let categoryList = [
    {id:"gate", name:"柵門問題", order:1},
    {id:"fee", name:"繳費問題", order:2},
    {id:"ticket", name:"發票/載具", order:3},
    {id:"other", name:"其他", order:4}
];
let qaData = [];

// --- 初始化變數 ---
let adminMode = false;
let editingId = null;
let logoClicks = 0;
let currentTag = 'all';

function countLogoClick() {
    logoClicks++;
    if (logoClicks >= 5) {
        document.getElementById('configModal').classList.add('open');
        document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
        document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
        renderCatManager();
        logoClicks = 0;
    }
}

function renderCatManager() {
    const div = document.getElementById('catManager');
    div.innerHTML = categoryList.map((c, i) => `
        <div style="display:flex; gap:5px; margin-bottom:5px">
            <input type="text" value="${c.name}" onchange="updateCatName(${i}, this.value)" style="flex:2">
            <input type="number" value="${c.order}" onchange="updateCatOrder(${i}, this.value)" style="flex:1" title="顯示順序">
        </div>
    `).join('');
}
function updateCatName(i, v) { categoryList[i].name = v; }
function updateCatOrder(i, v) { categoryList[i].order = parseInt(v); }

function saveConfigAndSync() {
    localStorage.setItem('gh_token', document.getElementById('ghToken').value);
    localStorage.setItem('gh_repo', document.getElementById('ghRepo').value);
    submitToCloud(); // 儲存類別變更
}

function render() {
    const sortedCats = [...categoryList].sort((a,b) => a.order - b.order);
    const catMap = {}; sortedCats.forEach(c => catMap[c.id] = c.name);
    
    document.getElementById('tagRow').innerHTML = `<span class="tag ${currentTag==='all'?'active':''}" onclick="setFilter('all')">全部</span>` + 
        sortedCats.map(c => `<span class="tag ${currentTag===c.id?'active':''}" onclick="setFilter('${c.id}')">${c.name}</span>`).join('');

    const kw = document.getElementById('searchInput').value.toLowerCase();
    const filtered = qaData.filter(d => (currentTag === 'all' || d.tag === currentTag) && (d.q.toLowerCase().includes(kw) || d.intro.toLowerCase().includes(kw)));

    document.getElementById('qaList').innerHTML = filtered.map(item => `
        <div class="qa-card" onclick="this.classList.toggle('open')">
            <div class="qa-header">
                <span class="q-badge">${catMap[item.tag] || '未知'}</span>
                <span class="q-text">${item.q}</span>
                ${adminMode ? `<button class="btn" onclick="event.stopPropagation();editItem(${item.id})">編輯</button>` : ''}
            </div>
            <div class="qa-body">
                <div class="a-intro">話術：${item.intro}</div>
                ${item.steps.map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div><div>${s}</div></div>`).join('')}
                <button class="btn btn-primary" style="width:100%" onclick="event.stopPropagation();copyText('${item.intro}\\n${item.steps.join('\\n')}')">複製話術</button>
            </div>
        </div>
    `).join('');
}

function setFilter(t) { currentTag = t; render(); }
function toggleAdmin() {
    adminMode = !adminMode;
    document.getElementById('adminBtn').textContent = adminMode ? '完成退出' : '進入後台';
    if(adminMode) {
        let btn = document.createElement('button');
        btn.id = 'floatAdd'; btn.className = 'btn btn-primary';
        btn.style = 'position:fixed; bottom:30px; right:30px; border-radius:50px; padding:15px 25px; box-shadow:0 10px 20px rgba(0,0,0,0.2)';
        btn.textContent = '＋ 新增 SOP';
        btn.onclick = () => { editingId=null; openQA(); };
        document.body.appendChild(btn);
    } else { document.getElementById('floatAdd')?.remove(); }
    render();
}

function editItem(id) {
    editingId = id;
    const item = qaData.find(d => d.id === id);
    document.getElementById('fTag').innerHTML = categoryList.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
    document.getElementById('fTag').value = item.tag;
    document.getElementById('fQ').value = item.q;
    document.getElementById('fIntro').value = item.intro;
    document.getElementById('fSteps').value = item.steps.join('\n');
    openQA();
}
function openQA() { 
    if(!editingId) {
        document.getElementById('fQ').value = ''; document.getElementById('fIntro').value = ''; document.getElementById('fSteps').value = '';
        document.getElementById('fTag').innerHTML = categoryList.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
    }
    document.getElementById('qaModal').classList.add('open'); 
}
function closeQA() { document.getElementById('qaModal').classList.remove('open'); }
function closeConfig() { document.getElementById('configModal').classList.remove('open'); }

async function submitToCloud() {
    const token = localStorage.getItem('gh_token');
    const repo = localStorage.getItem('gh_repo');
    if(!token || !repo) return alert("請設定 Token");

    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = "同步中...";

    if(editingId || (!editingId && document.getElementById('fQ').value)) {
        const newItem = { id: editingId || Date.now(), tag: document.getElementById('fTag').value, q: document.getElementById('fQ').value, intro: document.getElementById('fIntro').value, steps: document.getElementById('fSteps').value.split('\n').filter(x=>x.trim()) };
        if(editingId) qaData[qaData.findIndex(d => d.id === editingId)] = newItem;
        else qaData.push(newItem);
    }

    try {
        const url = `https://api.github.com/repos/${repo}/contents/index.html`;
        const res = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
        const fileData = await res.json();
        const oldContent = decodeURIComponent(escape(atob(fileData.content)));
        const newCode = `// --- 資料區 ---\nlet categoryList = ${JSON.stringify(categoryList)};\nlet qaData = ${JSON.stringify(qaData)};\n\n// --- 初始化變數 ---`;
        const newFull = oldContent.substring(0, oldContent.indexOf("// --- 資料區")) + newCode + oldContent.substring(oldContent.indexOf("// --- 初始化變數 ---"));

        await fetch(url, {
            method: 'PUT',
            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: 'Update Data', content: btoa(unescape(encodeURIComponent(newFull))), sha: fileData.sha })
        });
        alert("✅ 同步成功！"); closeQA(); closeConfig(); render();
    } catch (e) { alert("同步失敗！"); } finally { btn.disabled = false; btn.textContent = "更新雲端"; }
}

function copyText(txt) { navigator.clipboard.writeText(txt.replace(/\\n/g, '\n')); alert('已複製！'); }
if(localStorage.getItem('gh_token')) document.getElementById('adminBtnContainer').style.display = 'block';
render();
</script>
</body>
</html>
